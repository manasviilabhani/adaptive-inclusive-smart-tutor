spring.application.name=adaptive-tutor
server.port=${PORT:8080}

# PostgreSQL connection (override with env vars DB_URL, or DB_HOST / DB_PORT / DB_NAME, plus DB_USERNAME / DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:adaptive_tutor}}
spring.datasource.username=${DB_USERNAME:${USER:postgres}}
spring.datasource.password=${DB_PASSWORD:}

# Schema is owned by Flyway migrations in db/migration; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Frontend dev server allowed to call the API
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
